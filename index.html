<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: none;
        }
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 99999;
        }
    </style>
</head>
<body>
    <video id="vid" autoplay loop muted playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>
    <script>
        const video = document.getElementById('vid');
        
        // Función para entrar en pantalla completa
        function goFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
        
        // Reproducir video
        video.play().catch(e => {
            console.log('Autoplay bloqueado:', e);
            // Reintentar al hacer clic
            document.addEventListener('click', () => video.play(), { once: true });
        });
        
        // Intentar pantalla completa al cargar
        window.addEventListener('load', () => {
            setTimeout(goFullscreen, 1500);
        });
        
        // Entrar en pantalla completa al hacer clic, presionar tecla o tocar
        document.addEventListener('click', goFullscreen);
        document.addEventListener('keydown', goFullscreen);
        document.addEventListener('touchstart', goFullscreen);
        
        // Prevenir salir de pantalla completa
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                setTimeout(goFullscreen, 100);
            }
        });
        
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) {
                setTimeout(goFullscreen, 100);
            }
        });
    </script>
</body>
</html>
